name: Update profile

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours: day/night cycle + live weather
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generator/**", ".github/workflows/update-profile.yml"]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest -v
      - name: Render panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT with read:user to also count private contributions.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python -m generator.main
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "chore: refresh homelab console"
          git push
