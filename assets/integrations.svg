<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="neon" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2fd0"/>
</linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
  <path d="M20 0H0V20" fill="none" stroke="#132033" stroke-width=".6"/>
</pattern>
<linearGradient id="scanline" x1="0" x2="0" y1="0" y2="1">
  <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
  <stop offset=".5" stop-color="#00e5ff" stop-opacity=".07"/>
  <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; fill: #c9d6e5; }
.dim { fill: #5c6f88; }
.cyan { fill: #00e5ff; } .mag { fill: #ff2fd0; } .green { fill: #39ff88; }
.amber { fill: #ffb547; } .red { fill: #ff4d6d; }
.b { font-weight: 700; }
.fade { opacity: 0; animation: fade .35s ease-out forwards; }
@keyframes fade { to { opacity: 1; } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.scan { animation: scan 7s linear infinite; }
@keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(var(--h)); } }

.card { opacity: 0; animation: pop .45s cubic-bezier(.2,1.4,.4,1) forwards; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
.bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s ease-out forwards; }
@keyframes grow { to { transform: scaleX(1); } }
</style>
